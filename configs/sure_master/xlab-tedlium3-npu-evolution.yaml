session:
  type: local
  local:
    working_dir: /shared/chaolei.liu/SURE-Evolve/runs/tedlium3_evolution/workspace
    timeout: 86400
    gpu_devices: none
    parallel:
      enabled: true
      max_parallel: 4
      split_workspace_for_exp: true
      set_asr_world_size: false
llm_output:
  show_in_console: true
  log_to_file: true
logging:
  level: INFO
  format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
  file: null
  console: true
