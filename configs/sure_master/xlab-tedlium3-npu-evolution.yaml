sure:
  root: /shared/chaolei.liu/sure-eval
  pythonpath: /shared/chaolei.liu/sure-eval/src
  task_cards_path: /shared/chaolei.liu/SURE-Evolve/playground/sure_master/task_cards/sure_tasks.yaml
  task_id: asr_en_wer
  device: cpu
  cache_dir: null
  validate_env: false
  require_base_model: true
  workspace_cleanup:
    enabled: true
    on_success: true
    on_failure: false
    remove_models: true
    remove_working: true
    remove_runtime_cache: true
    compact_metric_logs: true
    keep_log_tails: true
    log_tail_bytes: 65536
  execution_mode: slurm
  search_strategy: ordinary
  coordinator:
    local_gpu_policy: disabled
  remote_training:
    enabled: false
  initial_solution_path: /shared/chaolei.liu/SURE-Evolve/playground/sure_master/baselines/tedlium_native_baseline.py
  inputs:
    ref: /shared/chaolei.liu/data/sure_tedlium3_full/refs/asr_tedlium3_regular_ref.txt
  execution_env:
    SURE_STAGE_DATA: '1'
    SURE_ASR_FIXED_BUDGET: '1'
    SURE_ASR_DATASET: tedlium3
    SURE_ASR_RECIPE_PROFILE: tedlium3_zipformer_native
    SURE_ASR_EVAL_SPLITS: dev
    SURE_ASR_EVAL_REF_ONLY: '1'
    SURE_ICEFALL_PYTHON: python
    PYTHONPATH: /shared/chaolei.liu/SURE-Evolve:/shared/chaolei.liu/ASR/icefall
    SURE_ASR_ZIPFORMER_WRAPPER: /shared/chaolei.liu/SURE-Evolve/playground/sure_master/tools/run_icefall_zipformer_candidate.py
    SURE_ASR_REQUIRE_ZIPFORMER_WRAPPER: '1'
    SURE_MAX_TRAIN_EPOCHS: '10'
    SURE_ASR_FIXED_SEED: '42'
    SURE_MAX_DURATION: '30'
    SURE_BASELINE_TRAIN_MAX_DURATION: '30'
    SURE_BASELINE_DECODE_MAX_DURATION: '30'
    SURE_DECODE_DURATION_MIN: '30'
    SURE_DECODE_DURATION_MAX: '30'
    SURE_DECODE_DURATION_SAFETY_STEPS: '0'
    SURE_TRAIN_DURATION_MIN: '10'
    SURE_DURATION_AUTOTUNE_MIN: '10'
    SURE_TRAIN_DURATION_RETRY_STEP: '10'
    SURE_DURATION_AUTOTUNE: '0'
    SURE_USE_FP16: '0'
    SURE_BASELINE_USE_PRETRAINED: '0'
    SURE_DECODE_ONLY: '0'
    SURE_BASELINE_EPOCH: '10'
    SURE_BASELINE_AVG: '1'
    SURE_BASELINE_USE_AVERAGED_MODEL: '0'
    SURE_BASELINE_WORLD_SIZE: '8'
    ASR_WORLD_SIZE: '8'
    SURE_ENABLE_MUSAN: '0'
    SURE_ASR_REQUIRE_LOCAL_CHECKPOINT: '1'
    SURE_ASR_FAIL_ON_TRAIN_FATAL_WITHOUT_CHECKPOINT: '1'
    SURE_DECODE_METHOD: greedy_search
    SURE_RUN_TIMEOUT: '0'
    SURE_BASELINE_TRAIN_TIMEOUT: '0'
    SURE_BASELINE_DECODE_TIMEOUT: '0'
    SURE_TRAIN_DURATION_RETRY: '0'
  base_models:
    asr_en_wer:
      source_paths:
        root: /shared/chaolei.liu/ASR/icefall
        recipe: /shared/chaolei.liu/ASR/icefall/egs/tedlium3/ASR/zipformer
        data: /shared/chaolei.liu/data/sure_tedlium3_full/search_100h
      python: python
  runtime:
    accelerator: npu
    world_size: 8
    cpu_threads: 8
    precision: fp32
    python: python
  metric_gpu:
    enabled: false
  preflight: true
  require_training_candidate: false
  execution_contract:
    accelerator: npu
    model_family: zipformer
    dataset: tedlium3
    training_epochs: 10
    training_hours: 100
    precision: fp32
    world_size: 8
    decode_method: greedy_search
    structure_arguments:
    - num-encoder-layers
    - encoder-dim
    - feedforward-dim
    - encoder-unmasked-dim
    training_seed: 42
    max_duration: 30
    metric: WER
    metric_direction: lower
    constraints:
    - Use the guarded Zipformer wrapper.
    - Keep the RNN-T objective.
    - Train only on train; never use test during search.
    - Use the same seed and epoch budget as baseline.
    initialization: All training candidates start from scratch, same seed and budget.
      Inference reuses the frozen round parent.
  final_evaluation:
    selection_ref: /shared/chaolei.liu/data/sure_tedlium3_full/refs/asr_tedlium3_selection_ref.txt
    test_ref: /shared/chaolei.liu/data/sure_tedlium3_full/refs/asr_tedlium3_test_ref.txt
  controller_timeout_seconds: 0
  require_model_artifact: true
  search_budget:
    min_rounds: 6
    max_rounds: 10
    patience: 3
  full_training:
    enabled: true
    data: /shared/chaolei.liu/data/sure_tedlium3_full
    epochs: 30
  slurm:
    shared_root: /shared/chaolei.liu
    image: registry.cluster.local:5000/users/chaolei-liu/sure-zipformer@sha256:d557a61e7beb3b675917946061e63790997fc9f672563fe7882f3336b1a8fa64
    partition: compute
    max_parallel: 4
    time_limit: 1-00:00:00
    poll_seconds: 20
    max_segments: 30
max_research_rounds: 6
llm:
  openai:
    provider: openai
    model: ${SURE_AGENT_MODEL}
    api_key: ${OPENAI_API_KEY}
    base_url: ${OPENAI_BASE_URL}
    temperature: 1
    max_tokens: 32768
    timeout: 3600
  default: openai
agents:
  prefetch:
    llm: openai
    max_turns: 10
    tools:
      builtin: []
    context:
      max_tokens: 128000
      truncation_strategy: latest_half
      preserve_system_messages: true
      preserve_recent_turns: 5
    system_prompt_file: /shared/chaolei.liu/SURE-Evolve/playground/sure_master/prompts/prefetch_system_prompt.txt
    user_prompt_file: /shared/chaolei.liu/SURE-Evolve/playground/sure_master/prompts/prefetch_user_prompt.txt
