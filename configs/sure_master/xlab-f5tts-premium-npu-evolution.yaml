sure:
  root: /shared/chaolei.liu/sure-eval
  pythonpath: /shared/chaolei.liu/sure-eval/src
  task_cards_path: /shared/chaolei.liu/SURE-Evolve/playground/sure_master/task_cards/sure_tasks.yaml
  task_id: tts_zh_cer
  device: cpu
  cache_dir: /shared/chaolei.liu/data/sure_tts_resources/metric_cache
  validate_env: false
  require_base_model: true
  workspace_cleanup:
    enabled: true
    on_success: true
    on_failure: false
    remove_models: false
    remove_working: false
    remove_runtime_cache: true
    compact_metric_logs: true
    keep_log_tails: true
    log_tail_bytes: 65536
  execution_mode: slurm
  search_strategy: ordinary
  search_scope: all
  coordinator:
    local_gpu_policy: disabled
  remote_training:
    enabled: false
  initial_solution_path: /shared/chaolei.liu/SURE-Evolve/playground/sure_master/baselines/task_baseline.py
  execution_env:
    SURE_REQUIRE_CANDIDATE_CHANGES: '1'
    TOKENIZERS_PARALLELISM: 'false'
    WANDB_MODE: offline
    SURE_RUN_TIMEOUT: '0'
    ACCELERATE_MIXED_PRECISION: 'no'
    SURE_TRAIN_WORLD_SIZE: '8'
    SURE_STAGE_TTS_AUDIO: '1'
    SURE_F5_PREPARED_CACHE: /local/job/f5-prepared
    SURE_TRAIN_PRECISION: bf16
    SURE_F5_DATALOADER_WORKERS: '4'
    PYTORCH_NPU_ALLOC_CONF: expandable_segments:True
    PYTHONPATH: /shared/chaolei.liu/SURE-Evolve
    HF_HUB_OFFLINE: '1'
    ASCEND_PROCESS_LOG_PATH: /local/job/ascend/log
    ASCEND_WORK_PATH: /local/job/ascend/work
  base_models:
    tts_zh_cer:
      model_id: f5tts_v1_base
      framework: f5-tts
      usage_policy: required
      required_paths:
        root: base_model/root
      source_paths:
        root: /shared/chaolei.liu/TTS/F5-TTS
      python: python
      prompt_guidance: Use SURE_TASK_WRAPPER unified candidates and workspace source;
        freely combine research interventions while completing 50 epochs for any
        weight update.
  runtime:
    accelerator: npu
    devices:
    - '0'
    python: python
    precision: fp32
    training_precision: bf16
    cpu_threads: 8
    world_size: 8
  metric_gpu:
    enabled: false
  preflight:
    enabled: true
  require_training_candidate: false
  execution_contract:
    initialization: Fixed official weights and fresh optimizer for each weight-updating
      candidate; inference inherits the frozen round parent.
    training_epochs: 50
    world_size: 8
    precision: bf16
    master_parameter_precision: fp32
    inference_precision: fp32
    constraints:
    - Train only on the complete Premium train split.
    - Never use selection or Seed holdout for search or training.
    - Complete 50 epochs and use final EMA before scoring.
    - Research is free across model, training and inference; no type quotas.
  adapter: tts.f5tts
  require_model_artifact: true
  source_snapshot:
    enabled: true
  metric_runtime:
    python: python
    device: cpu
    tts_runtime: worker
    timeout_seconds: 0
  datasets:
    train:
      manifest: /shared/chaolei.liu/data/sure_premium_f5tts/train/manifest.jsonl
    train_validation:
      manifest: /shared/chaolei.liu/data/sure_premium_f5tts/train_validation/manifest.jsonl
    search:
      manifest: /shared/chaolei.liu/data/sure_premium_f5tts/search/manifest.jsonl
    selection:
      manifest: /shared/chaolei.liu/data/sure_premium_f5tts/selection/manifest.jsonl
    holdout:
      manifest: /shared/chaolei.liu/data/sure_premium_f5tts/holdout/manifest.jsonl
  task:
    language: zh
    resources:
      source: /shared/chaolei.liu/TTS/F5-TTS
      checkpoint: /shared/chaolei.liu/TTS/F5-TTS/ckpts/F5-TTS/F5TTS_v1_Base/model_1250000.safetensors
      vocab: /shared/chaolei.liu/TTS/F5-TTS/ckpts/F5-TTS/F5TTS_v1_Base/vocab.txt
      vocoder: /shared/chaolei.liu/data/sure_tts_resources/vocos-mel-24khz
    training:
      recipe: f5tts.evolution.v1.ddp8.bf16
      epochs: 50
      learning_rate: 1.0e-05
      batch_size_type: frame
      batch_size_per_gpu: 25600
      max_samples: 64
      grad_accumulation_steps: 1
      num_warmup_updates: 20000
      max_grad_norm: 1.0
      seed: 42
      shuffle_seed: 666
      world_size: 8
      save_per_updates: 50000
      checkpoint_every_updates: 5000
      keep_last_n_checkpoints: -1
      early_stopping_patience: 0
      checkpoint_selection: final_ema
      initialization: official_pretrained_weights
      manifest: /shared/chaolei.liu/data/sure_premium_f5tts/train/metadata.csv
    inference:
      nfe_step: 32
      cfg_strength: 2.0
      sway_sampling_coef: -1.0
      speed: 1.0
      remove_silence: false
      text_cleanup: none
      max_chunk_chars: 300
      min_chunk_chars: 40
      target_rms: 0.1
      cross_fade_duration: 0.15
  training_mode: full_during_search
  data_preparation: /shared/chaolei.liu/data/sure_premium_f5tts/preparation.json
  controller_timeout_seconds: 0
  search_budget:
    ideas_per_round: 3
    min_rounds: 6
    max_rounds: 10
    patience: 3
  slurm:
    shared_root: /shared/chaolei.liu
    image: ${SURE_TTS_IMAGE}
    partition: compute
    training_devices: 8
    max_parallel: 3
    time_limit: 7-00:00:00
    max_segments: 30
    poll_seconds: 20
max_research_rounds: 10
llm:
  zai_flash:
    provider: openai
    model: glm-5.3-flash
    api_key: ${ZAI_API_KEY}
    base_url: ${ZAI_BASE_URL}
    temperature: 1
    max_tokens: 32768
    timeout: 3600
  default: zai_flash
agents:
  prefetch:
    llm: zai_flash
    max_turns: 10
    tools:
      builtin: []
    context:
      max_tokens: 128000
      truncation_strategy: latest_half
      preserve_system_messages: true
      preserve_recent_turns: 5
    system_prompt_file: /shared/chaolei.liu/SURE-Evolve/playground/sure_master/prompts/prefetch_system_prompt.txt
    user_prompt_file: /shared/chaolei.liu/SURE-Evolve/playground/sure_master/prompts/prefetch_user_prompt.txt
  draft:
    llm: zai_flash
    max_turns: 10
    tools:
      builtin: []
    context:
      max_tokens: 128000
      truncation_strategy: latest_half
      preserve_system_messages: true
      preserve_recent_turns: 5
    system_prompt_file: /shared/chaolei.liu/SURE-Evolve/playground/sure_master/prompts/draft_system_prompt.txt
    user_prompt_file: /shared/chaolei.liu/SURE-Evolve/playground/sure_master/prompts/draft_user_prompt.txt
  debug:
    llm: zai_flash
    max_turns: 10
    tools:
      builtin: []
    context:
      max_tokens: 128000
      truncation_strategy: latest_half
      preserve_system_messages: true
      preserve_recent_turns: 5
    system_prompt_file: /shared/chaolei.liu/SURE-Evolve/playground/sure_master/prompts/debug_system_prompt.txt
    user_prompt_file: /shared/chaolei.liu/SURE-Evolve/playground/sure_master/prompts/debug_user_prompt.txt
  improve:
    llm: zai_flash
    max_turns: 10
    tools:
      builtin: []
    context:
      max_tokens: 128000
      truncation_strategy: latest_half
      preserve_system_messages: true
      preserve_recent_turns: 5
    system_prompt_file: /shared/chaolei.liu/SURE-Evolve/playground/sure_master/prompts/improve_system_prompt.txt
    user_prompt_file: /shared/chaolei.liu/SURE-Evolve/playground/sure_master/prompts/improve_user_prompt.txt
  knowledge_promotion:
    llm: zai_flash
    max_turns: 10
    tools:
      builtin: []
    context:
      max_tokens: 128000
      truncation_strategy: latest_half
      preserve_system_messages: true
      preserve_recent_turns: 5
    system_prompt_file: /shared/chaolei.liu/SURE-Evolve/playground/sure_master/prompts/knowledge_promotion_system_prompt.txt
    user_prompt_file: /shared/chaolei.liu/SURE-Evolve/playground/sure_master/prompts/knowledge_promotion_user_prompt.txt
  wisdom_promotion:
    llm: zai_flash
    max_turns: 10
    tools:
      builtin: []
    context:
      max_tokens: 128000
      truncation_strategy: latest_half
      preserve_system_messages: true
      preserve_recent_turns: 5
    system_prompt_file: /shared/chaolei.liu/SURE-Evolve/playground/sure_master/prompts/wisdom_promotion_system_prompt.txt
    user_prompt_file: /shared/chaolei.liu/SURE-Evolve/playground/sure_master/prompts/wisdom_promotion_user_prompt.txt
  reseach:
    llm: zai_flash
    max_turns: 10
    tools:
      builtin: []
    context:
      max_tokens: 128000
      truncation_strategy: latest_half
      preserve_system_messages: true
      preserve_recent_turns: 5
    system_prompt_file: /shared/chaolei.liu/SURE-Evolve/playground/sure_master/prompts/reseach_system_prompt.txt
    user_prompt_file: /shared/chaolei.liu/SURE-Evolve/playground/sure_master/prompts/reseach_user_prompt.txt
session:
  type: local
  local:
    working_dir: /shared/chaolei.liu/SURE-Evolve/runs/f5tts_premium_evolution/search/workspace
    timeout: 0
    gpu_devices: none
    parallel:
      enabled: true
      max_parallel: 3
      split_workspace_for_exp: true
      set_asr_world_size: false
llm_output:
  show_in_console: true
  log_to_file: true
logging:
  level: INFO
  format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
  file: null
  console: true
xlab:
  enabled: true
  idea_generation:
    max_attempts: 8
  idea_provider:
    enabled: true
    preflight_command:
    - /shared/chaolei.liu/data/sure_asr_controller/bin/python
    - /shared/chaolei.liu/SURE-Evolve/playground/sure_master/tools/with_api_profile.py
    - --env-file
    - /shared/chaolei.liu/SURE-Evolve/.env
    - --role
    - xlab
    - --
    - /shared/chaolei.liu/data/sure_xlab_runtime312/bin/python
    - /shared/chaolei.liu/XLab/xlab/skills/sure_master/scripts/xlab_idea_client.py
    - --check-survey
    - /shared/chaolei.liu/XLab/.xlab/runs/20260910-survey-tts-v2/artifacts/survey.json
    command:
    - /shared/chaolei.liu/data/sure_asr_controller/bin/python
    - /shared/chaolei.liu/SURE-Evolve/playground/sure_master/tools/with_api_profile.py
    - --env-file
    - /shared/chaolei.liu/SURE-Evolve/.env
    - --role
    - xlab
    - --
    - /shared/chaolei.liu/data/sure_xlab_runtime312/bin/python
    - /shared/chaolei.liu/XLab/xlab/skills/sure_master/scripts/xlab_idea_client.py
    timeout_seconds: 14400
    environment:
      XLAB_SURE_SURVEY_PATH: /shared/chaolei.liu/XLab/.xlab/runs/20260910-survey-tts-v2/artifacts/survey.json
      XLAB_SURE_RUN_ROOT: /shared/chaolei.liu/SURE-Evolve/runs/f5tts_premium_evolution/xlab_ideas
api_profile:
  provider: zai_controller_xi_xlab
  env_file: /shared/chaolei.liu/SURE-Evolve/.env
