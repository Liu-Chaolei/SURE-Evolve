# Full official-budget training during architecture-only search.
sure:
  root: ${SURE_EVAL_ROOT}
  pythonpath: ${SURE_EVAL_ROOT}/src
  task_cards_path: ./playground/sure_master/task_cards/sure_tasks.yaml
  task_id: sd_der
  device: cpu
  cache_dir: null
  validate_env: false
  require_base_model: true
  workspace_cleanup:
    enabled: true
    on_success: true
    on_failure: false
    remove_models: true
    remove_working: true
    remove_runtime_cache: true
    compact_metric_logs: true
    keep_log_tails: true
    log_tail_bytes: 65536
  execution_mode: local
  search_strategy: ordinary
  search_scope: architecture_only
  coordinator:
    local_gpu_policy: disabled
  remote_training:
    enabled: false
  initial_solution_path: playground/sure_master/baselines/task_baseline.py
  execution_env:
    SURE_REQUIRE_CANDIDATE_CHANGES: '1'
    TOKENIZERS_PARALLELISM: 'false'
    WANDB_MODE: offline
    SURE_RUN_TIMEOUT: '0'
    ACCELERATE_MIXED_PRECISION: 'no'
  base_models:
    sd_der:
      model_id: diarizen_wavlm_updated_ami
      framework: diarizen
      usage_policy: required
      required_paths:
        root: base_model/root
      source_paths:
        root: ${SURE_DIARIZEN_ROOT}
      python: ${SURE_WORKER_PYTHON}
      prompt_guidance: Use SURE_TASK_WRAPPER with --action infer|fine_tune|arch and
        --parameters-json; model/data dependencies are supplied by the adapter.
  runtime:
    accelerator: cuda
    devices:
    - '0'
    - '1'
    - '2'
    - '3'
    python: ${SURE_WORKER_PYTHON}
    precision: fp32
    cpu_threads: 4
    world_size: 4
  metric_gpu:
    enabled: false
  preflight:
    enabled: true
  require_training_candidate: true
  execution_contract:
    initialization: fixed baseline for training; round best for inference
    training_seed: 3407
    precision: fp32
    world_size: 4
    candidate_entrypoint: SURE_TASK_WRAPPER
    constraints:
    - Only change registered wrapper parameters.
    - Train only on train; never access holdout during search.
    - Frozen evaluation never trains.
    training_epochs: 100
    training_recipe: diarizen.wavlm_updated.v1
    completion: 100 epochs or validation-loss patience 10
  adapter: sd.diarizen
  require_model_artifact: true
  source_snapshot:
    enabled: true
  metric_runtime:
    python: ${SURE_METRIC_PYTHON}
    device: cpu
  datasets:
    train:
      manifest: ${SURE_SD_DATA}/train/manifest.jsonl
    train_validation:
      manifest: ${SURE_SD_DATA}/train_validation/manifest.jsonl
    search:
      manifest: ${SURE_SD_DATA}/search/manifest.jsonl
      roles:
        ref: ${SURE_SD_DATA}/search/ref.rttm
    selection:
      manifest: ${SURE_SD_DATA}/selection/manifest.jsonl
      roles:
        ref: ${SURE_SD_DATA}/selection/ref.rttm
    holdout:
      manifest: ${SURE_SD_DATA}/holdout/manifest.jsonl
      roles:
        ref: ${SURE_SD_DATA}/holdout/ref.rttm
  task:
    resources:
      source: ${SURE_DIARIZEN_ROOT}
      embedding: ${SURE_SD_EMBEDDING}
      wavlm: ${SURE_WAVLM_INIT}
    training:
      recipe: diarizen.wavlm_updated.v1
      epochs: 100
      learning_rate_wavlm: 2.0e-05
      learning_rate_network: 0.001
      batch_size: 16
      validation_batch_size: 8
      grad_accumulation_steps: 1
      chunk_size: 8
      chunk_shift: 6
      validation_chunk_shift: 8
      drop_last: true
      seed: 3407
      shuffle_seed: 3407
      world_size: 4
      freeze_wavlm: false
      gradient_percentile: 90
      gradient_history_size: 1000
      validation_interval: 1
      early_stopping_patience: 10
      lr_decay: false
      use_one_cycle_lr: false
      checkpoint_every_updates: 500
      checkpoint_selection: best5_validation_loss
      initialization: ssl_backbone_new_diarization_network
    inference:
      seg_duration: 8
      segmentation_step: 0.1
      batch_size: 32
      apply_median_filtering: true
      clustering_method: AgglomerativeClustering
      min_speakers: 1
      max_speakers: 20
      min_cluster_size: 30
      ahc_threshold: 0.7
  training_mode: full_during_search
  data_preparation: ${SURE_SD_DATA}/preparation.json
  controller_timeout_seconds: 0
max_research_rounds: 2
llm:
  openai:
    provider: openai
    model: ${SURE_AGENT_MODEL}
    api_key: ${OPENAI_API_KEY}
    base_url: ${OPENAI_BASE_URL}
    temperature: 1
    max_tokens: 32768
    timeout: 3600
  default: openai
agents:
  prefetch:
    llm: openai
    max_turns: 10
    tools:
      builtin: []
    context:
      max_tokens: 128000
      truncation_strategy: latest_half
      preserve_system_messages: true
      preserve_recent_turns: 5
    system_prompt_file: prompts/prefetch_system_prompt.txt
    user_prompt_file: prompts/prefetch_user_prompt.txt
  draft:
    llm: openai
    max_turns: 10
    tools:
      builtin: []
    context:
      max_tokens: 128000
      truncation_strategy: latest_half
      preserve_system_messages: true
      preserve_recent_turns: 5
    system_prompt_file: prompts/draft_system_prompt.txt
    user_prompt_file: prompts/draft_user_prompt.txt
  debug:
    llm: openai
    max_turns: 10
    tools:
      builtin: []
    context:
      max_tokens: 128000
      truncation_strategy: latest_half
      preserve_system_messages: true
      preserve_recent_turns: 5
    system_prompt_file: prompts/debug_system_prompt.txt
    user_prompt_file: prompts/debug_user_prompt.txt
  improve:
    llm: openai
    max_turns: 10
    tools:
      builtin: []
    context:
      max_tokens: 128000
      truncation_strategy: latest_half
      preserve_system_messages: true
      preserve_recent_turns: 5
    system_prompt_file: prompts/improve_system_prompt.txt
    user_prompt_file: prompts/improve_user_prompt.txt
  knowledge_promotion:
    llm: openai
    max_turns: 10
    tools:
      builtin: []
    context:
      max_tokens: 128000
      truncation_strategy: latest_half
      preserve_system_messages: true
      preserve_recent_turns: 5
    system_prompt_file: prompts/knowledge_promotion_system_prompt.txt
    user_prompt_file: prompts/knowledge_promotion_user_prompt.txt
  wisdom_promotion:
    llm: openai
    max_turns: 10
    tools:
      builtin: []
    context:
      max_tokens: 128000
      truncation_strategy: latest_half
      preserve_system_messages: true
      preserve_recent_turns: 5
    system_prompt_file: prompts/wisdom_promotion_system_prompt.txt
    user_prompt_file: prompts/wisdom_promotion_user_prompt.txt
session:
  type: local
  local:
    working_dir: ./runs/sd_cuda
    timeout: 43200
    gpu_devices: none
    parallel:
      enabled: true
      max_parallel: 1
      split_workspace_for_exp: true
      set_asr_world_size: false
llm_output:
  show_in_console: true
  log_to_file: true
logging:
  level: INFO
  format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
  file: null
  console: true
xlab:
  enabled: true
  idea_generation:
    max_attempts: 8
    engine: native
    feedback_kind: candidate_outcome
    refinement: current_best
    allow_auxiliary_experiments: false
    mcts:
      max_iterations: 64
      max_depth: 3
      branching_factor: 3
      exploration_constant: 1.2
  idea_provider:
    enabled: true
    preflight_command:
    - ${XLAB_PYTHON}
    - ${XLAB_ROOT}/xlab/skills/sure_master/scripts/xlab_idea_client.py
    - --check-survey
    - ${XLAB_SURE_SURVEY_PATH}
    command:
    - ${XLAB_PYTHON}
    - ${XLAB_ROOT}/xlab/skills/sure_master/scripts/xlab_idea_client.py
    timeout_seconds: 14400
    environment:
      XLAB_SURE_RUN_ROOT: ${SURE_EVOLVE_ROOT}/runs/xlab_ideas
      XLAB_SURE_SURVEY_PATH: ${XLAB_SURE_SURVEY_PATH}
