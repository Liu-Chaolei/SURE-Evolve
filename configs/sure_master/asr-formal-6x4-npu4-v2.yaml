      source_paths:
        root: /shared/chaolei.liu/ASR/icefall
        recipe: /shared/chaolei.liu/ASR/icefall/egs/tedlium3/ASR/zipformer
        data: /shared/chaolei.liu/data/sure_tedlium3_unigram500_musan_v2
      python: python
  runtime:
    accelerator: npu
    world_size: 4
    cpu_threads: 8
    precision: fp32
    python: python
  metric_gpu:
    enabled: false
  preflight: false
  require_training_candidate: false
  execution_contract:
    accelerator: npu
    model_family: zipformer
    dataset: tedlium3
    training_epochs: 30
    training_hours: 453.81294444445757
    training_split: full_train
    training_mode: full_during_search
    precision: fp32
    world_size: 4
    decode_method: greedy_search
    structure_arguments:
    - num-encoder-layers
    - encoder-dim
    - feedforward-dim
    - encoder-unmasked-dim
    training_seed: 42
    max_duration: 900
    metric: WER
    metric_direction: lower
    constraints:
    - Use the guarded Zipformer wrapper.
    - Keep the RNN-T objective.
    - Train only on train; never use test during search.
    - Use the same seed and epoch budget as baseline.
    - MUSAN is authorized for training noise only; use p=0.5 and SNR 10-20.
    - Preserve lowercase <unk> and the fixed official Unigram tokenizer.
    - Evaluate the identical last-10-epoch average in every phase.
    initialization: All training candidates start from scratch, same seed and budget.
      Inference reuses the frozen round parent.
    tokenizer: official_unigram_500
    enable_musan: true
    enable_spec_aug: true
    decode_avg: 10
    use_averaged_model: true
    averaging_device: cpu
    data_protocol: tedlium3.unigram500.musan.v2
    automatic_ablation: false
  final_evaluation:
    selection_ref: /shared/chaolei.liu/data/sure_tedlium3_unigram500_musan_v2/refs/asr_tedlium3_selection_ref.txt
