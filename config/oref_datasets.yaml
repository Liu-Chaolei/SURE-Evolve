    config_name: "aishell1"
    platform_dataset_name: "aispeech_phy_aishell-1-test"
    version_id: "v1.0.2"
    dataset_root: "/hpc_stor08/external_ds/aispeech/g001/store002/ds_pool/aispeech_phy_aishell-1-test"
    sample_jsonl: "/hpc_stor08/external_ds/aispeech/g001/store002/ds_pool/aispeech_phy_aishell-1-test/sample_files/v1.0.2/sample.jsonl"
    ds_jsonl: "/hpc_stor08/external_ds/aispeech/g001/store002/ds_pool/aispeech_phy_aishell-1-test/sample_files/v1.0.2/ds.jsonl"
    raw_dir: "/hpc_stor08/external_ds/aispeech/g001/store002/ds_pool/aispeech_phy_aishell-1-test/raws/sample"
